schema_version: "1.0"
stage: fe-rtl
project_name: "cnn_soc"
source_arch: {manifest: arch/arch_manifest.yaml, verified: true}
technology: {pdk: fpga_generic, node_nm: null, stdcell_lib: null}
technology_deviation: >
  FPGA target (Xilinx Artix-7 100T / Nexys A7 eventual target), not Sky130 — carried forward
  unchanged from arch_manifest.yaml / spec_manifest.yaml (binding instruction + cnn precedent).
  See spec/spec.md §2.1, arch/arch.md §2.1. Also carried: fully synchronous active-low rst_n
  (REQ-029) instead of the pipeline's async-reset default — rtl_coding_guidelines.md §3,
  arch/arch.md §2, every flop `always @(posedge clk) if (!rst_n) ... else ...`.
language: verilog-2005
dft: none

determinism:
  golden_package_commit: "e7569dbd389150a59c39832bf27bd1107998a6d3"   # frozen CNN golden package (reference-only)
  golden_package_files:
    - ../cnn/arch/golden_model/golden_ref_model.c
    - ../cnn/arch/golden_model/weights.hex
    - ../cnn/arch/golden_model/images.hex
    - ../cnn/arch/golden_model/labels.hex
    - ../cnn/arch/golden_model/expected.hex
    - ../cnn/arch/golden_model/expected_outputs.txt
  golden_reproduced_this_stage: false   # binding instruction: reference-only, NOT generated/regenerated by this stage (arch.md §11)
  sigmoid_lut_hex: ../cnn/rtl/sigmoid_lut.hex   # reused frozen LUT table (MEM-006)

reused_ip:   # verbatim byte-for-byte copies, diffed identical at copy time (ip/IP_PROVENANCE.md)
  - {file: ip/picorv32.v,      source: "skill-tests/ex6/rtl/picorv32.v",              license: "ISC (in-file header, (c) 2015 Claire Xenia Wolf)", note: "contains picorv32_axi + picorv32 + adapter + pcpi modules; only picorv32_axi instantiated"}
  - {file: ip/uart_tx.v,       source: "cnn/rtl/uart_tx.v",                           license: "project-internal"}
  - {file: ip/ctrl_fsm.v,      source: "cnn/rtl/ctrl_fsm.v",                          license: "project-internal"}
  - {file: ip/mac_datapath.v,  source: "cnn/rtl/mac_datapath.v",                      license: "project-internal"}
  - {file: ip/win_addr_gen.v,  source: "cnn/rtl/win_addr_gen.v",                      license: "project-internal"}
  - {file: ip/fm_ram.v,        source: "cnn/rtl/fm_ram.v",                            license: "project-internal"}
  - {file: ip/weight_rom.v,    source: "cnn/rtl/weight_rom.v",                        license: "project-internal"}
  - {file: ip/sigmoid_lut.v,   source: "cnn/rtl/sigmoid_lut.v",                       license: "project-internal"}
  - {file: rtl/cnn_defs.vh,    source: "cnn/rtl/cnn_defs.vh",                         license: "project-internal", note: "include-resolution copy (NOT synthesised; `define defaults only)"}
  - {file: rtl/mnist_npu_defs.vh, source: "cnn/rtl/mnist_npu_defs.vh",                license: "project-internal", note: "include-resolution copy so sigmoid_lut.v's `include resolves unedited"}

modules:
  - {block: BLK-001, module: cnn_soc,              file: rtl/cnn_soc.v,              source: custom, clock: clk, reset: rst_n, traces: [REQ-001, REQ-003, REQ-028, REQ-029, REQ-031, REQ-032], status: complete}
  - {block: BLK-002, module: axi_lite_interconnect, file: rtl/axi_lite_interconnect.v, source: custom, clock: clk, reset: rst_n, traces: [REQ-005, REQ-006, REQ-007, REQ-030], status: complete}
  - {block: BLK-003, module: bootrom,              file: rtl/bootrom.v,              source: custom, clock: clk, reset: rst_n, traces: [REQ-003, REQ-004, REQ-008], status: complete}
  - {block: BLK-004, module: sram,                 file: rtl/sram.v,                 source: custom, clock: clk, reset: rst_n, traces: [REQ-009, REQ-030], status: complete}
  - {block: BLK-005, module: vec_rom,              file: rtl/vec_rom.v,              source: custom, clock: clk, reset: rst_n, traces: [REQ-010, REQ-025], status: complete}
  - {block: BLK-006, module: axi2apb,              file: rtl/axi2apb.v,              source: custom, clock: clk, reset: rst_n, traces: [REQ-005, REQ-011], status: complete}
  - {block: BLK-007, module: apb_uart,             file: rtl/apb_uart.v,             source: custom, clock: clk, reset: rst_n, traces: [REQ-013, REQ-014, REQ-024], status: complete}
  - {block: BLK-008, module: apb_gpio,             file: rtl/apb_gpio.v,             source: custom, clock: clk, reset: rst_n, traces: [REQ-006, REQ-015, REQ-026, REQ-030], status: complete}
  - {block: BLK-009, module: cnn_axi_slave,        file: rtl/cnn_axi_slave.v,        source: custom, clock: clk, reset: rst_n, traces: [REQ-005, REQ-012, REQ-016, REQ-017, REQ-018, REQ-019, REQ-020, REQ-021, REQ-030], status: complete}
  - {block: BLK-010, module: cnn_infer,            file: rtl/cnn_infer.v,            source: custom, clock: clk, reset: rst_n, traces: [REQ-018, REQ-019, REQ-020, REQ-021, REQ-022, REQ-023, REQ-031], status: complete}
  - {block: BLK-011, module: image_buffer,         file: rtl/image_buffer.v,         source: custom, clock: clk, reset: rst_n, traces: [REQ-020, REQ-030], status: complete}
  - {block: BLK-012, module: picorv32_axi,         file: ip/picorv32.v,              source: reuse,  clock: clk, reset: rst_n, repo: "skill-tests/ex6/rtl/picorv32.v", commit: null, license: "ISC", traces: [REQ-002, REQ-003, REQ-005, REQ-027], status: complete}
  - {block: BLK-013, module: uart_tx,              file: ip/uart_tx.v,               source: reuse,  clock: clk, reset: rst_n, repo: "cnn/rtl/uart_tx.v", commit: null, license: "project-internal", traces: [REQ-013, REQ-014, REQ-021], status: complete}
  - {block: BLK-014, module: ctrl_fsm,             file: ip/ctrl_fsm.v,              source: reuse,  clock: clk, reset: rst_n, repo: "cnn/rtl/ctrl_fsm.v", commit: null, license: "project-internal", traces: [REQ-022], status: complete}
  - {block: BLK-015, module: mac_datapath,         file: ip/mac_datapath.v,          source: reuse,  clock: clk, reset: rst_n, repo: "cnn/rtl/mac_datapath.v", commit: null, license: "project-internal", traces: [REQ-022], status: complete}
  - {block: BLK-016, module: win_addr_gen,         file: ip/win_addr_gen.v,          source: reuse,  clock: clk, reset: rst_n, repo: "cnn/rtl/win_addr_gen.v", commit: null, license: "project-internal", traces: [REQ-022], status: complete}
  - {block: BLK-017, module: fm_ram,               file: ip/fm_ram.v,                source: reuse,  clock: clk, reset: rst_n, repo: "cnn/rtl/fm_ram.v", commit: null, license: "project-internal", traces: [REQ-022], status: complete}
  - {block: BLK-018, module: weight_rom,           file: ip/weight_rom.v,            source: reuse,  clock: clk, reset: rst_n, repo: "cnn/rtl/weight_rom.v", commit: null, license: "project-internal", traces: [REQ-019, REQ-022, REQ-023], status: complete}
  - {block: BLK-019, module: sigmoid_lut,          file: ip/sigmoid_lut.v,           source: reuse,  clock: clk, reset: rst_n, repo: "cnn/rtl/sigmoid_lut.v", commit: null, license: "project-internal", traces: [REQ-022, REQ-023], status: complete}

cdc_implementations: []   # single clock domain, 0 CDC paths — cdc_plan.md

sdc: {file: sdc/sdc_spec.json, consumer: fe-opensta, clocks: 1, generated_clocks: 0,
      false_paths: 0, multicycle_paths: 0, async_groups: 0}

filelist: {file: filelist.f, includes: [rtl, ip], excludes: []}   # no rtl/blackbox — no analog macros

testbenches: []   # none written this stage — verification is a later stage (G1–G5)

tools_executed: "none — stage policy (AGENTS.md): artifacts only; the user runs the compile gate"

authoring_note: >
  BLK-006 axi2apb was dispatched to a subagent which died to a provider session limit (0 tokens)
  at 12:44 UTC; per the standing orchestrator fallback precedent (memory 2026-08-20) the
  orchestrator self-authored BLK-006 and the remaining modules (BLK-002, BLK-009, BLK-010,
  BLK-001) directly from the frozen arch contracts, validating each with the fe-rtl §9 grep
  gates (no SV, no delays, sync-reset only, no initials beyond $readmemh, default-deassert
  no-latch pattern, named connections, module==filename, port-list parity vs arch.md).

review_gate:
  all_modules_present: true      # 19/19 BLK in arch_manifest module_list have a module (11 custom + 8 reused verbatim)
  no_systemverilog: true
  no_dft: true
  no_inferred_latches: true
  all_flops_reset_or_exempt: true   # contents of sram/bootrom/vec_rom/image_buffer exempt (memory, not flops)
  all_cdc_implemented: true
  sdc_complete: true

open_issues: []   # none raised this stage; arch.md §14 had 0 — next free OI id is OI-011

user_next_steps:
  - "iverilog -g2005 -s cnn_soc -o /tmp/cnn_soc_check.vvp -f filelist.f   # fe-rtl compile gate (run from cnn_soc/ root)"
  - "iverilog -g2005 -f filelist.f   # user's stated gate form also passes (compile-only, no -s needed)"
  - "fe-firmware: pure-ROM firmware -> sw/firmware.hex (BOOT_HEX_FILE default)"
  - 'yosys -p "read_verilog $(cat filelist.f); synth -top cnn_soc"   # or feed filelist.f into fe-yosys %%RTL%%'
  - "python3 <fe-opensta>/scripts/gen_sdc.py sdc/sdc_spec.json sdc/cnn_soc.sdc && bash <fe-opensta>/scripts/qa_sdc.sh cnn_soc <netlist> sdc/cnn_soc.sdc"
