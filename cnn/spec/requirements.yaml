schema_version: "1.0"
stage: fe-spec
project:
  name: "cnn"
  product_name: "mnist_npu_v2"
  top_module: "cnn_npu"
  technology: fpga_generic          # DEVIATION from fe-spec default (sky130); see spec.md §2.1
  node_nm: null
  fpga_target: "Xilinx Artix-7 100T (Nexys A7) — eventual target, implementation out of scope this stage"
  rtl_language: verilog-2001
  dft: none

requirements:
  # ---- Functional: network / arithmetic contract (bit-exact to golden) ----
  - id: REQ-001
    title: "CNN topology, forward-pass only"
    category: functional
    description: "The design shall implement Conv1(3x3,1->8ch,pad=1,stride=1,ReLU) -> Pool1(2x2 max,stride=2) -> Conv2(3x3,8->16ch,pad=1,stride=1,ReLU) -> Pool2(2x2 max,stride=2) -> FC1(784->32,sigmoid) -> FC2(32->10,sigmoid), performing inference (forward pass) only. No training, backpropagation, weight update, or freeze/unfreeze logic shall be implemented in RTL."
    priority: must
    measurable_target: "0 training/backprop/weight-update constructs present in RTL; layer shapes exactly as listed"
    source: user_brief
    rationale: "Inference-only accelerator per task brief §4 and golden_model/README.md"
    verification: {method: simulation, items: [VP-TOP-002, VP-CTRL-001]}
    status: agreed

  - id: REQ-002
    title: "Q8.8 fixed-point, 64-bit accumulation, bit-exact to golden"
    category: functional
    description: "All datapath arithmetic shall use 16-bit signed Q8.8 fixed-point representation with 64-bit signed accumulation and shall reproduce arch/golden_model/golden_ref_model.c bit-exactly for every one of the 100 golden vector images."
    priority: must
    measurable_target: "0 mismatches vs expected.hex across the 100-image vector set"
    source: user_brief
    rationale: "Golden model is the frozen bit-exact contract (arch/golden_model/README.md)"
    verification: {method: simulation, items: [VP-TOP-002]}
    status: agreed

  - id: REQ-003
    title: "Pixel input encoding"
    category: functional
    description: "Each input pixel byte p (0..255, unsigned) shall be interpreted directly as the Q8.8 value p (i.e. real value p/256), zero-extended to a 16-bit operand for multiplication. No scaling or offset is applied."
    priority: must
    measurable_target: "img_operand[15:0] = {8'h00, pixel_byte[7:0]}"
    source: golden_model
    rationale: "golden_ref_model.c: img[] read directly as int64_t multiplicand"
    verification: {method: simulation, items: [VP-MAC-001]}
    status: agreed

  - id: REQ-004
    title: "Conv1 MAC, 3x3 zero-padded window"
    category: functional
    description: "For each output channel oc (0..7) and each output pixel (oy,ox) in 0..27, the design shall compute acc64 = (conv1_b[oc]<<8) + SUM over iy,ix in 0..2 of img[oy+iy-1][ox+ix-1] * conv1_w[oc*9+iy*3+ix], where any (oy+iy-1,ox+ix-1) outside [0,27]x[0,27] contributes exactly 0 (zero-padding, not a wrapped or clamped index). Bias is pre-shifted to Q16.16 alignment (bias<<8), matching REQ-002's accumulation rule with no intermediate truncation, saturation, or rounding before the REQ-005 shift."
    priority: must
    measurable_target: "acc64 computed over the full <=9-term sum + bias, out-of-bounds taps contribute 0, no intermediate clipping"
    source: golden_model
    rationale: "golden_ref_model.c forward(), conv1 loop"
    verification: {method: simulation, items: [VP-MAC-001, VP-MAC-002]}
    status: agreed

  - id: REQ-005
    title: "Pre-activation shift and int16 saturation (shared by all conv/FC layers)"
    category: functional
    description: "z = acc64 >> 8 (arithmetic, floor-toward-negative-infinity shift, on the signed 64-bit accumulator). z shall then be saturated (clamped) to the signed 16-bit range [-32768, 32767] before being used as the next stage's input (ReLU for conv layers, sigmoid LUT address for FC layers)."
    priority: must
    measurable_target: "z == clamp(acc64 >> 8, -32768, 32767) for all reachable acc64 values, at every conv/FC unit"
    source: golden_model
    rationale: "golden_ref_model.c: `z = sat(acc >> 8);` used identically in conv1/conv2/fc1/fc2"
    verification: {method: simulation, items: [VP-MAC-003]}
    status: agreed

  - id: REQ-006
    title: "ReLU activation on conv-layer outputs"
    category: functional
    description: "For conv1 and conv2 only, the post-shift/saturate value z (REQ-005) shall be passed through h = (z > 0) ? z : 0 before being written to the feature-map RAM. No sigmoid LUT is used on the conv path."
    priority: must
    measurable_target: "h == max(z,0) bit-exact for every conv1/conv2 output unit, all 100 vector images"
    source: golden_model
    rationale: "golden_ref_model.c: `h1[...] = z > 0 ? z : 0;` (conv1), identical form for conv2"
    verification: {method: simulation, items: [VP-MAC-001, VP-RELU-001]}
    status: agreed

  - id: REQ-007
    title: "Pool1: 2x2 max, stride 2"
    category: functional
    description: "For each channel oc (0..7) and each output position (oy,ox) in 0..13, p1[oc][oy][ox] shall equal max(h1[oc][2oy][2ox], h1[oc][2oy][2ox+1], h1[oc][2oy+1][2ox], h1[oc][2oy+1][2ox+1]) — a non-overlapping 2x2 max-pool over the 28x28x8 conv1 output, producing 14x14x8."
    priority: must
    measurable_target: "p1 bit-exact to golden for all 100 vector images"
    source: golden_model
    rationale: "golden_ref_model.c forward(), pool1 loop"
    verification: {method: simulation, items: [VP-POOL-001]}
    status: agreed

  - id: REQ-008
    title: "Conv2 MAC, 3x3 zero-padded window over 8 input channels"
    category: functional
    description: "For each output channel oc (0..15) and each output pixel (oy,ox) in 0..13, the design shall compute acc64 = (conv2_b[oc]<<8) + SUM over ic in 0..7, iy,ix in 0..2 of p1[ic][oy+iy-1][ox+ix-1] * conv2_w[(oc*8+ic)*9+iy*3+ix], with the same zero-padding, bias-alignment and no-intermediate-clipping rules as REQ-004 (72 MAC terms per output unit instead of 9)."
    priority: must
    measurable_target: "acc64 computed over the full <=72-term sum + bias per output unit, bit-exact to golden"
    source: golden_model
    rationale: "golden_ref_model.c forward(), conv2 loop"
    verification: {method: simulation, items: [VP-MAC-001, VP-MAC-002]}
    status: agreed

  - id: REQ-009
    title: "Pool2: 2x2 max, stride 2"
    category: functional
    description: "For each channel oc (0..15) and each output position (oy,ox) in 0..6, p2[oc][oy][ox] shall equal the 2x2 max-pool of the 14x14x16 conv2 output (post-ReLU), producing 7x7x16 = 784 values."
    priority: must
    measurable_target: "p2 bit-exact to golden for all 100 vector images"
    source: golden_model
    rationale: "golden_ref_model.c forward(), pool2 loop"
    verification: {method: simulation, items: [VP-POOL-001]}
    status: agreed

  - id: REQ-010
    title: "FC1 MAC and sigmoid activation"
    category: functional
    description: "For each hidden unit j (0..31), the design shall compute acc64 = (fc1_b[j]<<8) + SUM over i=0..783 of p2_flat[i] * fc1_w[i*32+j] (REQ-012 flatten order), then z = sat(acc64>>8) (REQ-005), then h3[j] = sigmoid_lut[z] (REQ-022), producing 32 hidden activations in range 1..255."
    priority: must
    measurable_target: "h3 bit-exact to golden for all 100 vector images"
    source: golden_model
    rationale: "golden_ref_model.c forward(), fc1 loop"
    verification: {method: simulation, items: [VP-MAC-001, VP-TOP-002]}
    status: agreed

  - id: REQ-011
    title: "FC2 MAC and sigmoid activation"
    category: functional
    description: "For each output c (0..9), the design shall compute acc64 = (fc2_b[c]<<8) + SUM over j=0..31 of h3[j] * fc2_w[j*10+c], then z = sat(acc64>>8), then out[c] = sigmoid_lut[z], producing the 10 final output sigmas (range 1..255)."
    priority: must
    measurable_target: "out[0..9] bit-exact to golden for all 100 vector images"
    source: golden_model
    rationale: "golden_ref_model.c forward(), fc2 loop"
    verification: {method: simulation, items: [VP-MAC-001, VP-TOP-002]}
    status: agreed

  - id: REQ-012
    title: "Feature-map flatten order into FC1"
    category: functional
    description: "The 7x7x16 pool2 output shall be presented to FC1 in channel-major flattened order f[oc*49 + oy*7 + ox] (oc 0..15, oy/ox 0..6), matching fc1_w's row index i in REQ-010/013 exactly."
    priority: must
    measurable_target: "FC1 input index i == oc*49 + oy*7 + ox for every (oc,oy,ox)"
    source: golden_model
    rationale: "golden_ref_model.c: p2 stored and consumed in exactly this address order (no explicit flatten step needed if p2 is stored in this order)"
    verification: {method: inspection, items: [VP-MEM-002]}
    status: agreed

  - id: REQ-013
    title: "Weight indexing convention"
    category: functional
    description: "Conv weights shall be indexed oc*IC*9 + ic*9 + iy*3 + ix (IC=1 for conv1, IC=8 for conv2; iy,ix in 0..2). fc1 weights shall be indexed i*32+j (input i -> hidden j, row-major). fc2 weights shall be indexed j*10+c (hidden j -> output c, row-major). This is the exact layout of arch/golden_model/weights.hex per the region table in spec.md §3."
    priority: must
    measurable_target: "weight ROM address for every tap/connection matches the stated formula exactly"
    source: golden_model
    rationale: "arch/golden_model/README.md weight layout section; golden_ref_model.c load_weights()"
    verification: {method: inspection, items: [VP-ROM-001]}
    status: agreed

  - id: REQ-014
    title: "Argmax with lowest-index tie-break"
    category: functional
    description: "pred = argmax over out[0..9]; if two or more outputs tie for the maximum value, the LOWEST index shall win (strict greater-than comparison scanning c=1..9 against the running best, matching golden_ref_model.c)."
    priority: must
    measurable_target: "pred matches golden for all 100 vector images, including any tie cases present in the set"
    source: golden_model
    rationale: "golden_ref_model.c: `if (out[i] > out[best]) best = i;`"
    verification: {method: simulation, items: [VP-TOP-002]}
    status: agreed

  - id: REQ-015
    title: "Confidence computation"
    category: functional
    description: "confidence = (out[pred] * 100) >> 8, an unsigned value in range 0..100."
    priority: must
    measurable_target: "confidence bit-exact to golden for all 100 vector images"
    source: golden_model
    rationale: "golden_ref_model.c: `conf = (out[best]*100) >> 8;`"
    verification: {method: simulation, items: [VP-TOP-002]}
    status: agreed

  - id: REQ-016
    title: "Verdict classification"
    category: functional
    description: "verdict = 2 (TRASH) if confidence < 50; else verdict = 0 (CORRECT) if pred == expected_label; else verdict = 1 (INCORRECT). expected_label is read from the label ROM (REQ-021) for the current image index."
    priority: must
    measurable_target: "verdict bit-exact to expected.hex for all 100 vector images"
    source: user_brief
    rationale: "Task brief verdict definition, matches golden_ref_model.c"
    verification: {method: simulation, items: [VP-TOP-002]}
    status: agreed

  - id: REQ-017
    title: "MAC accumulator width bound"
    category: functional
    description: "The MAC accumulator register shall be at least 41 bits wide, signed, sufficient to hold the worst-case magnitude bound across all layers: |acc| <= 784*32767*32768 + 32767*256 ~= 8.418e11 (FC1, the dominant term; conv2's 72*32767*32768 ~= 7.73e10 and conv1/FC2 are far smaller), without overflow or intermediate truncation. The design uses a full 64-bit signed accumulator, matching the golden model's int64_t accumulation semantics exactly (bit-exact by construction, not merely bounded)."
    priority: must
    measurable_target: "accumulator_width_bits == 64 (or a documented-sufficient width >= 41 bits with an equivalent margin proof)"
    source: derived
    rationale: "Arithmetic bound computed from golden model's value ranges (see description); prevents silent overflow that would break REQ-002 bit-exactness"
    verification: {method: analysis, items: [VP-MAC-002]}
    status: agreed

  - id: REQ-018
    title: "Single shared MAC datapath"
    category: functional
    description: "The design shall implement exactly one multiply-accumulate datapath (one 16-bit x 16-bit signed multiplier producing a 32-bit signed product, sign-extended into one shared 64-bit accumulator), reused sequentially across all conv taps, pool comparisons, and FC MAC steps of every layer. No per-unit or per-layer duplication of the multiplier is permitted."
    priority: must
    measurable_target: "exactly 1 multiplier instance in the synthesised design"
    source: user_brief
    rationale: "Task brief §5: 'single MAC unit'; consistent with v1's single-MAC convention"
    verification: {method: inspection, items: [VP-CTRL-001]}
    status: agreed

  # ---- Memory / interfaces ----
  - id: REQ-019
    title: "Weight ROM, memory-initialised"
    category: interface
    description: "A 26,698 x 16-bit signed ROM shall be initialised via $readmemh from the frozen file arch/golden_model/weights.hex, laid out per spec.md §3 (conv1_w | conv1_b | conv2_w | conv2_b | fc1_w | fc1_b | fc2_w | fc2_b). No host interface, bootrom, or firmware loads this memory; initialisation is simulation/synthesis $readmemh only."
    priority: must
    measurable_target: "ROM depth 26698, width 16 bits; contents identical to weights.hex"
    source: user_brief
    rationale: "Task brief §3, golden package layout"
    verification: {method: simulation, items: [VP-ROM-001]}
    status: agreed

  - id: REQ-020
    title: "Image ROM, memory-initialised"
    category: interface
    description: "A 78,400 x 8-bit unsigned ROM (100 images x 784 pixels) shall be initialised via $readmemh from the frozen file arch/golden_model/images.hex."
    priority: must
    measurable_target: "ROM depth 78400, width 8 bits; contents identical to images.hex"
    source: user_brief
    rationale: "Task brief §3, §4"
    verification: {method: simulation, items: [VP-ROM-001]}
    status: agreed

  - id: REQ-021
    title: "Label ROM, memory-initialised"
    category: interface
    description: "A 100 x 8-bit unsigned ROM shall be initialised via $readmemh from the frozen file arch/golden_model/labels.hex, providing the expected label for each image index used in REQ-016."
    priority: must
    measurable_target: "ROM depth 100, width 8 bits; contents identical to labels.hex"
    source: user_brief
    rationale: "Task brief §3, §4"
    verification: {method: simulation, items: [VP-ROM-001]}
    status: agreed

  - id: REQ-022
    title: "Sigmoid activation via 65536x8 LUT, reused unchanged from v1"
    category: functional
    description: "FC1/FC2 activation shall be computed by a combinational/single-cycle lookup into the same 65536-entry x 8-bit ROM used by v1 mnist_npu, addressed by the full 16-bit signed z (address = z as an unsigned 16-bit index, two's-complement bit pattern). LUT data at address z shall equal sigma(z) = 128 + trunc(128*z / (256+|z|)), C99 truncate-toward-zero, for ALL 65536 possible z values. No divider circuit shall be present in the RTL activation path. The v1-generated sigmoid_lut.hex content is reused verbatim (identical sigmoid function, no regeneration needed)."
    priority: must
    measurable_target: "LUT[z] == golden sigmoid(z) for all 65536 z in [-32768,32767]"
    source: user_brief
    rationale: "Task brief §5 — non-negotiable bit-exactness requirement; v1 LUT reuse explicitly directed"
    verification: {method: simulation, items: [VP-LUT-001, VP-LUT-002]}
    status: agreed

  - id: REQ-023
    title: "Feature-map RAM, reused across layers with a documented address map"
    category: interface
    description: "A single feature-map RAM instance shall store all inter-layer activations (conv1 output, pool1 output, conv2 output, pool2 output, FC1 output), sized and address-mapped per arch.md's per-layer address map (fe-arch responsibility), rather than instantiating a separate RAM per layer. The map must guarantee no live data is overwritten before its last consumer reads it."
    priority: must
    measurable_target: "1 feature-map RAM module instantiated; per-layer address ranges documented in arch.md with a data-hazard-free write/read order proof"
    source: user_brief
    rationale: "Task brief §5: 'reuse one RAM across layers with a documented per-layer address map'"
    verification: {method: inspection, items: [VP-MEM-001]}
    status: agreed

  - id: REQ-024
    title: "Free-running inference loop"
    category: functional
    description: "After reset release, the design shall infer image index 0, then 1, ... then 99, then wrap back to image index 0, repeating forever with no external start/stop control and no host interface. There shall be no CSR, APB, or register-mapped control/status block of any kind."
    priority: must
    measurable_target: "image index sequence == (0,1,...,99,0,1,...) indefinitely; 0 host-interface signals in top-level ports"
    source: user_brief
    rationale: "Task brief §5 (same product as v1 externally)"
    verification: {method: simulation, items: [VP-TOP-003]}
    status: agreed

  # ---- Pacing / timing parameters ----
  - id: REQ-025
    title: "HOLD_CYCLES pacing parameter"
    category: performance
    description: "A parameter HOLD_CYCLES shall control the number of clock cycles the completed result (LED[11:0] value and the just-transmitted UART line) is held stable after an image's inference completes and before the next image's inference begins. Default HOLD_CYCLES = 50,000,000 (~0.5 s at 100 MHz); simulation builds shall override HOLD_CYCLES to a small value via Verilog parameter override, with no RTL source edits."
    priority: must
    measurable_target: "HOLD_CYCLES is a module parameter with documented default and simulation override; result held stable for exactly HOLD_CYCLES cycles"
    source: user_brief
    rationale: "Task brief §5"
    verification: {method: simulation, items: [VP-TOP-007]}
    status: agreed

  - id: REQ-026
    title: "BLINK_CYCLES parameter, default fixed at 100,000 (v1 bug fix)"
    category: performance
    description: "BLINK_CYCLES shall be a module parameter setting the half-period (in clock cycles) of the LED[11] toggle in REQ-027. Default value MUST be 100,000 (this fixes the v1 defect where a 5,000,000 default made the blink invisible within the ~7 ms compute-busy window). Simulation builds may further override to a small value."
    priority: must
    measurable_target: "BLINK_CYCLES default == 100000 exactly; module parameter with documented simulation override"
    source: user_brief
    rationale: "Task brief §5: 'BLINK_CYCLES (default MUST be 100_000 — this fixes the v1 bug...)'"
    verification: {method: inspection, items: [VP-LED-003]}
    status: agreed

  # ---- LED outputs ----
  - id: REQ-027
    title: "LED[11] busy-blink indicator"
    category: functional
    description: "LED[11] shall toggle (blink) at a rate governed by parameter BLINK_CYCLES from the moment an image's inference computation begins until the result (LED[9:0]/LED[10]) is presented; LED[11] shall then hold at a constant (non-blinking) value for the remainder of the HOLD_CYCLES window."
    priority: must
    measurable_target: "LED[11] toggles at the BLINK_CYCLES half-period only during the busy/compute window; constant during the hold window"
    source: user_brief
    rationale: "Task brief §5 (same LED scheme as v1)"
    verification: {method: simulation, items: [VP-TOP-006, VP-LED-003]}
    status: agreed

  - id: REQ-028
    title: "LED[9:0] one-hot predicted digit, trash-off"
    category: functional
    description: "When verdict != TRASH (verdict 0 or 1), LED[9:0] shall be one-hot with bit `pred` set and all other bits clear. When verdict == TRASH (verdict 2), ALL of LED[9:0] shall be OFF (0)."
    priority: must
    measurable_target: "LED[9:0] pattern matches expected pred/verdict for all 100 vector images; exactly one bit set when verdict != 2, zero bits set when verdict == 2"
    source: user_brief
    rationale: "Task brief §5 (same LED scheme as v1)"
    verification: {method: simulation, items: [VP-TOP-005, VP-LED-001]}
    status: agreed

  - id: REQ-029
    title: "LED[10] fail/trash indicator"
    category: functional
    description: "LED[10] shall be ON (1) when verdict != 0 (i.e. INCORRECT or TRASH) and OFF (0) when verdict == 0 (CORRECT)."
    priority: must
    measurable_target: "LED[10] == (verdict != 0) for all 100 vector images"
    source: user_brief
    rationale: "Task brief §5 (same LED scheme as v1)"
    verification: {method: simulation, items: [VP-TOP-005, VP-LED-002]}
    status: agreed

  - id: REQ-030
    title: "Reset output state"
    category: reset
    description: "On reset (rst_n == 0), LED[11:0] shall all be 0 and uart_tx shall be held at idle-mark (logic 1). Immediately upon reset release, the design shall begin computing image index 0 and LED[11] shall begin blinking per REQ-027; LED[9:0]/LED[10] shall remain 0 until the first result is presented."
    priority: must
    measurable_target: "led[11:0]==12'h000 and uart_tx==1'b1 while rst_n==0; first inference targets image index 0"
    source: derived
    rationale: "Reset-value completeness required by fe-spec review gate; matches v1 REQ-030"
    verification: {method: simulation, items: [VP-TOP-001]}
    status: agreed

  # ---- UART ----
  - id: REQ-031
    title: "UART TX 115200 8N1"
    category: interface
    description: "The design shall include a standard UART transmitter: 115200 baud, 8 data bits, no parity, 1 stop bit (8N1), with clock divider CLK_DIV = 868 (round(100e6/115200)) at the default 100 MHz clock. UART RX is NOT required/implemented. uart_tx idles high (mark) between frames."
    priority: must
    measurable_target: "bit period == CLK_DIV clk_core cycles; frame = 1 start(0) + 8 data(LSB first) + 1 stop(1)"
    source: user_brief
    rationale: "Task brief §5, §4 (same UART line format as v1)"
    verification: {method: simulation, items: [VP-UART-001, VP-UART-002]}
    status: agreed

  - id: REQ-032
    title: "UART line format, exact bytes (identical strings to v1)"
    category: interface
    description: |
      For each image, after the result is computed the design shall transmit exactly one ASCII line over uart_tx, terminated by a single 0x0A (LF only, no CR), in one of these three forms (IMG index zero-padded to 3 digits, all numbers ASCII decimal):
        verdict 0: "IMG %03u: This is number %u | confidence %u%% | expected %u | CORRECT\n"
        verdict 1: "IMG %03u: This is number %u | confidence %u%% | expected %u | INCORRECT\n"
        verdict 2: "IMG %03u: NOT A NUMBER | confidence %u%% | expected %u | TRASH\n"
    priority: must
    measurable_target: "byte-for-byte match against the golden line format for all 100 vector images"
    source: user_brief
    rationale: "Task brief §4 (exact bytes, same format strings as v1 mnist_npu)"
    verification: {method: simulation, items: [VP-UART-001]}
    status: agreed

  - id: REQ-033
    title: "UART idle/mark state"
    category: interface
    description: "uart_tx shall idle at logic 1 (mark) whenever no frame is being transmitted, including during reset and during the HOLD_CYCLES window between transmissions."
    priority: must
    measurable_target: "uart_tx == 1'b1 outside of active frame transmission"
    source: standard
    rationale: "Standard UART idle convention, implied by 8N1 requirement REQ-031"
    verification: {method: simulation, items: [VP-UART-002]}
    status: agreed

  # ---- Clock / reset / language / synthesis ----
  - id: REQ-034
    title: "Single clock domain, synchronous reset"
    category: clocking
    description: "The design shall use exactly one clock domain (CD_CORE, nominal 100 MHz) and one reset signal rst_n, active-low, fully SYNCHRONOUS (registered on posedge clk; no asynchronous reset input to any flop). This deviates from the fe-spec default reset template (async-assert/sync-deassert) by explicit project requirement, identical to v1."
    priority: must
    measurable_target: "1 clock domain; 0 always@(posedge clk or negedge rst_n) constructs in RTL; reset qualifies via always@(posedge clk) if(!rst_n) ... "
    source: user_brief
    rationale: "Task brief §5: port list 'clk, rst_n (sync active-low), led[11:0], uart_tx'"
    verification: {method: inspection, items: [VP-TOP-001]}
    status: agreed

  - id: REQ-035
    title: "Pure Verilog-2001/2005 coding discipline"
    category: compliance
    description: "RTL shall be pure Verilog-2001/2005 (IEEE 1364): no SystemVerilog constructs; no module-scope `integer` shared across two or more always blocks; no inferred latches (every always@* assigns a default to every LHS; every case has a default)."
    priority: must
    measurable_target: "0 forbidden-construct matches on grep sweep; 0 latch-inferring always blocks"
    source: user_brief
    rationale: "Task brief §5"
    verification: {method: inspection, items: [VP-CTRL-002]}
    status: agreed

  - id: REQ-036
    title: "FPGA-synthesizable memories and constructs"
    category: compliance
    description: "All ROMs/RAMs (weight ROM, image ROM, label ROM, sigmoid LUT, feature-map RAM) shall be described so that a Xilinx synthesis tool infers BRAM using $readmemh-initialised `reg` arrays with registered, statically-bounded addressing, no dynamic multi-dimensional indexing that would force full-array replication. FPGA implementation (bitstream, timing closure, pin constraints) is explicitly OUT OF SCOPE for this stage."
    priority: must
    measurable_target: "every memory array is a single reg[..:0] array indexed by a registered address; no unbounded dynamic index"
    source: user_brief
