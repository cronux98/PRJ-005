assumptions:
  - id: ASM-001
    statement: "Minimum reset assert width is 2 clk_core cycles (rst_n held low for >= 2 rising edges before release is considered a valid reset)."
    basis: "No value given by the brief for a synchronous single-domain design; 2 cycles is the minimum needed for the synchronous FSM/registers to settle to their reset values before rst_n release is sampled. Identical to v1's ASM-001."
    impact: "Sets the testbench's minimum reset-hold time in VP-TOP-001; has no effect on the bit-exact datapath contract."
    requires_confirmation: true

  - id: ASM-002
    statement: "Core clock frequency is exactly 100 MHz (10.000 ns period), consistent with the HOLD_CYCLES/CLK_DIV numeric values given directly by the brief."
    basis: "Brief gives HOLD_CYCLES=50,000,000 (~0.5s) and CLK_DIV=868 (115200 baud), both of which are exact only at 100 MHz; 100 MHz is taken as the exact nominal target, identical to v1's ASM-002."
    impact: "Confirms HOLD_CYCLES default and CLK_DIV=868 derivation; purely a clocking/timing assumption, no effect on bit-exactness."
    requires_confirmation: true

