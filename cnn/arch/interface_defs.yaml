schema_version: "1.0"
stage: fe-arch
external_interfaces:      # copied faithfully from spec/interfaces.yaml
  - id: IF-001
    name: uart_tx_if
    protocol: UART
    clock: clk_core
    reset: rst_n
    signals:
      - {name: uart_tx, dir: output, width: 1, active: high}
  - id: IF-002
    name: led_status_if
    protocol: custom
    clock: clk_core
    reset: rst_n
    signals:
      - {name: "led[9:0]", dir: output, width: 10, active: high}
      - {name: "led[10]",  dir: output, width: 1,  active: high}
      - {name: "led[11]",  dir: output, width: 1,  active: high}
  - id: IF-003
    name: sys_if
    protocol: custom
    clock: clk_core
    reset: rst_n
    signals:
      - {name: clk,   dir: input, width: 1, active: high}
      - {name: rst_n, dir: input, width: 1, active: low}

internal_interfaces:
  - id: IFI-001
    name: mac_operands
    from_block: BLK-002   # ctrl_fsm (drives address/select muxing)
    to_block: BLK-003     # mac_datapath
    clock: clk_core
    type: status           # ctrl_fsm fully sequences the datapath, 1 MAC step per 2 cycles, no backpressure
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: mac_a,       dir: from_source, width: 16, description: "operand A: pixel/fm_ram word, zero-extended, or 0 when tap_valid_r==0 (zero-pad)"}
      - {name: mac_b,       dir: from_source, width: 16, description: "operand B: weight, from weight_rom"}
      - {name: mac_bias_ld, dir: from_source, width: 1,  description: "1 = load acc with bias<<8 this cycle (PH_BIAS_ACC)"}
      - {name: mac_bias,    dir: from_source, width: 16, description: "bias value for mac_bias_ld"}
      - {name: mac_acc_en,  dir: from_source, width: 1,  description: "1 = accumulate mac_a*mac_b into acc this cycle"}
      - {name: mac_z,       dir: from_sink,    width: 16, description: "combinational, saturated z = acc>>>8, valid the cycle after the last acc_en step"}
      - {name: mac_h,       dir: from_sink,    width: 16, description: "combinational, ReLU'd z (max(z,0)) — conv-path activation, REQ-006"}

  - id: IFI-002
    name: lut_port
    from_block: BLK-002    # ctrl_fsm supplies the address (mac_z, registered)
    to_block: BLK-004      # sigmoid_lut (wired to its addr/rdata ports)
    clock: clk_core
    type: status
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: lut_addr, dir: from_source, width: 16, description: "z, two's-complement bit pattern, registered address"}
      - {name: lut_data, dir: from_sink,   width: 8,  description: "sigma(z), 1 cycle of registered ROM read latency"}

  - id: IFI-003
    name: weight_rom_port
    from_block: BLK-002    # forwards win_addr_gen's computed wrom_addr (IFI-010)
    to_block: BLK-005      # weight_rom
    clock: clk_core
    type: status
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: wrom_addr, dir: from_source, width: 15, description: "0..26697, see arch.md §7 address map"}
      - {name: wrom_data, dir: from_sink,   width: 16, description: "registered ROM read"}

  - id: IFI-004
    name: image_rom_port
    from_block: BLK-002
    to_block: BLK-006      # image_rom
    clock: clk_core
    type: status
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: irom_addr, dir: from_source, width: 17, description: "img_idx*784 + py*28+px, 0..78399"}
      - {name: irom_data, dir: from_sink,   width: 8,  description: "registered ROM read, unsigned pixel"}

  - id: IFI-005
    name: label_rom_port
    from_block: BLK-002
    to_block: BLK-007      # label_rom
    clock: clk_core
    type: status
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: lrom_addr, dir: from_source, width: 7, description: "img_idx, 0..99"}
      - {name: lrom_data, dir: from_sink,   width: 8, description: "registered ROM read, expected label"}

  - id: IFI-006
    name: fm_ram_port
    from_block: BLK-002
    to_block: BLK-008      # fm_ram
    clock: clk_core
    type: status            # single R/W port, ctrl_fsm's phase sequencing guarantees 1 op/cycle
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: fmram_addr,  dir: from_source, width: 13, description: "0..7839 (Region A 0..6271, Region B 6272..7839), see arch.md §7.1"}
      - {name: fmram_wdata, dir: from_source, width: 16, description: "value to write (mac_h, pool_max, or zero-extended sigma)"}
      - {name: fmram_we,    dir: from_source, width: 1,  description: "1 = write fmram_wdata this cycle"}
      - {name: fmram_rdata, dir: from_sink,   width: 16, description: "registered read, 1 cycle latency"}

  - id: IFI-007
    name: uart_tx_port
    from_block: BLK-011     # uart_line_fmt (NOT ctrl_fsm directly — see IFI-009)
    to_block: BLK-009       # uart_tx
    clock: clk_core
    type: valid_ready        # the one genuine handshake in the design: uart_tx is a real multi-cycle engine
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: true}
    signals:
      - {name: utx_data,  dir: from_source, width: 8, description: "byte to send"}
      - {name: utx_valid, dir: from_source, width: 1, description: "1-cycle strobe: utx_data is valid, send it"}
      - {name: utx_ready, dir: from_sink,   width: 1, description: "1 = uart_tx idle, ready to accept a new byte"}
      - {name: utx_busy,  dir: from_sink,   width: 1, description: "1 = a frame (start+8+stop) is currently shifting out"}

  - id: IFI-008
    name: led_ctrl_port
    from_block: BLK-002
    to_block: BLK-010      # led_ctrl
    clock: clk_core
    type: status
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: lc_pred,    dir: from_source, width: 4, description: "0..9, registered result"}
      - {name: lc_verdict, dir: from_source, width: 2, description: "0=CORRECT,1=INCORRECT,2=TRASH"}
      - {name: lc_present, dir: from_source, width: 1, description: "1-cycle strobe: latch lc_pred/lc_verdict into the LED[9:0]/LED[10] output regs"}
      - {name: lc_busy,    dir: from_source, width: 1, description: "1 while an image is being computed (drives LED[11] blink window, REQ-027)"}

  - id: IFI-009
    name: line_fmt_ctrl
    from_block: BLK-002     # ctrl_fsm
    to_block: BLK-011       # uart_line_fmt
    clock: clk_core
    type: status
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: lf_start,   dir: from_source, width: 1, description: "1-cycle strobe: begin composing/sending a line"}
      - {name: lf_pred,    dir: from_source, width: 4, description: "0..9"}
      - {name: lf_conf,    dir: from_source, width: 7, description: "0..100"}
      - {name: lf_exp,     dir: from_source, width: 4, description: "0..9, expected label"}
      - {name: lf_idx,     dir: from_source, width: 7, description: "0..99, image index"}
      - {name: lf_verdict, dir: from_source, width: 2, description: "0=CORRECT,1=INCORRECT,2=TRASH"}
      - {name: lf_done,    dir: from_sink,   width: 1, description: "1-cycle strobe: full line accepted by uart_tx"}

  - id: IFI-010
    name: win_addr_gen_port
    from_block: BLK-002     # ctrl_fsm drives the loop counters and layer_sel
    to_block: BLK-012       # win_addr_gen (purely combinational)
    clock: clk_core
    type: status
    semantics: {valid_may_depend_on_ready: false, data_stable_while_stalled: true, backpressure: false}
    signals:
      - {name: layer_sel,      dir: from_source, width: 3,  description: "0=CONV1,1=POOL1,2=CONV2,3=POOL2,4=FC1,5=FC2"}
      - {name: u_cnt,          dir: from_source, width: 5,  description: "output unit/channel index"}
      - {name: y_cnt,          dir: from_source, width: 5,  description: "output row (conv/pool only)"}
      - {name: x_cnt,          dir: from_source, width: 5,  description: "output col (conv/pool only)"}
      - {name: ic_cnt,         dir: from_source, width: 4,  description: "input channel (conv2 only)"}
      - {name: iy_cnt,         dir: from_source, width: 2,  description: "tap row 0..2"}
      - {name: ix_cnt,         dir: from_source, width: 2,  description: "tap col 0..2"}
      - {name: i_cnt,          dir: from_source, width: 10, description: "FC input index 0..783/0..31"}
      - {name: img_idx,        dir: from_source, width: 7,  description: "0..99"}
      - {name: irom_addr,      dir: from_sink,    width: 17, description: "computed image_rom address"}
      - {name: wrom_addr,      dir: from_sink,    width: 15, description: "computed weight_rom address"}
      - {name: fmram_rd_addr,  dir: from_sink,    width: 13, description: "computed fm_ram read address"}
      - {name: fmram_wr_addr,  dir: from_sink,    width: 13, description: "computed fm_ram write address"}
      - {name: tap_valid,      dir: from_sink,    width: 1,  description: "0 = this conv tap is zero-padded (out of bounds), force operand to 0"}

blocks:
  - id: BLK-001
    module: cnn_npu
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: HOLD_CYCLES,  default: 50000000, range: "1..2^32-1"}
      - {name: BLINK_CYCLES, default: 100000,    range: "1..2^32-1"}
      - {name: CLK_DIV,      default: 868,       range: "2..2^32-1"}
  - id: BLK-002
    module: ctrl_fsm
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: HOLD_CYCLES,  default: 50000000, range: "1..2^32-1"}
  - id: BLK-003
    module: mac_datapath
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters: []
  - id: BLK-004
    module: sigmoid_lut
    clock_domain: CD_CORE
    reset: rst_n
    source: reuse
    reuse_source: "mnist_npu/rtl/sigmoid_lut.v"
    parameters:
      - {name: LUT_HEX_FILE, default: "\"rtl/sigmoid_lut.hex\"", range: "n/a (string path)"}
  - id: BLK-005
    module: weight_rom
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: WEIGHTS_HEX_FILE, default: "\"arch/golden_model/weights.hex\"", range: "n/a (string path)"}
  - id: BLK-006
    module: image_rom
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: IMAGES_HEX_FILE, default: "\"arch/golden_model/images.hex\"", range: "n/a (string path)"}
  - id: BLK-007
    module: label_rom
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: LABELS_HEX_FILE, default: "\"arch/golden_model/labels.hex\"", range: "n/a (string path)"}
  - id: BLK-008
    module: fm_ram
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters: []
  - id: BLK-009
    module: uart_tx
    clock_domain: CD_CORE
    reset: rst_n
    source: reuse
    reuse_source: "mnist_npu/rtl/uart_tx.v"
    parameters:
      - {name: CLK_DIV, default: 868, range: "2..2^32-1"}
  - id: BLK-010
    module: led_ctrl
    clock_domain: CD_CORE
    reset: rst_n
    source: reuse
    reuse_source: "mnist_npu/rtl/led_ctrl.v"
    parameters:
      - {name: BLINK_CYCLES, default: 5000000, range: "1..2^32-1", note: "file's own default; cnn_npu MUST override to 100000 at instantiation, REQ-026"}
  - id: BLK-011
    module: uart_line_fmt
    clock_domain: CD_CORE
    reset: rst_n
    source: reuse
    reuse_source: "mnist_npu/rtl/uart_line_fmt.v"
    parameters:
      - {name: MAX_LINE_LEN, default: 80, range: "72..255 (must cover the longest formatted line)"}
  - id: BLK-012
    module: win_addr_gen
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters: []
