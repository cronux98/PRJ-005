schema_version: "1.0"
stage: fe-arch

external_interfaces:            # copied faithfully from fe-spec interfaces.yaml (IF-001, IF-002)
  - id: IF-001
    name: apb_slave
    protocol: APB4
    clock: clk_core
    reset: rst_n
    signals:
      - {name: psel,    dir: input,  width: 1,  active: high}
      - {name: penable, dir: input,  width: 1,  active: high}
      - {name: pwrite,  dir: input,  width: 1,  active: high}
      - {name: paddr,   dir: input,  width: 32, active: high}
      - {name: pwdata,  dir: input,  width: 32, active: high}
      - {name: prdata,  dir: output, width: 32, active: high}
      - {name: pready,  dir: output, width: 1,  active: high}
      - {name: pslverr, dir: output, width: 1,  active: high}
  - id: IF-002
    name: sample_stream
    protocol: custom_byte_stream
    clock: clk_core
    reset: rst_n
    signals:
      - {name: s_valid, dir: input,  width: 1,  active: high}
      - {name: s_ready, dir: output, width: 1,  active: high}
      - {name: s_data,  dir: input,  width: 8,  active: high}
      - {name: s_last,  dir: input,  width: 1,  active: high}
  - id: CLK-001
    name: clk_core
    protocol: clock
    clock: null
    reset: null
    signals:
      - {name: clk_core, dir: input, width: 1, active: high}
  - id: RST-001
    name: rst_n
    protocol: reset
    clock: clk_core
    reset: null
    signals:
      - {name: rst_n, dir: input, width: 1, active: low}

internal_interfaces:
  - id: IFI-001
    name: ctrl_learner
    from_block: BLK-002
    to_block: BLK-004
    clock: clk_core
    type: valid_only            # pulses + levels
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: false
    signals:
      - {name: start_p,    dir: from_source, width: 1, description: "1-cycle start strobe"}
      - {name: step_p,     dir: from_source, width: 1, description: "1-cycle step strobe"}
      - {name: halt_p,     dir: from_source, width: 1, description: "1-cycle halt strobe"}
      - {name: freeze,     dir: from_source, width: 1, description: "level: 1 = inference-only"}
      - {name: lr_shift,   dir: from_source, width: 4, description: "level: eta = 2^-lr_shift"}
  - id: IFI-002
    name: learner_stats
    from_block: BLK-004
    to_block: BLK-006
    clock: clk_core
    type: valid_only
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: false
    signals:
      - {name: sample_done_p, dir: from_source, width: 1, description: "1-cycle pulse per processed sample"}
      - {name: correct_p,     dir: from_source, width: 1, description: "1-cycle pulse: pred == label"}
      - {name: error_p,       dir: from_source, width: 1, description: "1-cycle pulse: pred != label"}
  - id: IFI-003
    name: stream_learner
    from_block: BLK-003
    to_block: BLK-004
    clock: clk_core
    type: valid_ready + memory_port
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: true
    signals:
      - {name: sample_valid, dir: from_source, width: 1, description: "level: full sample captured; cleared by ack_p or next label"}
      - {name: label,        dir: from_source, width: 8, description: "level: captured label byte"}
      - {name: ack_p,        dir: from_sink,   width: 1, description: "learner accept pulse"}
      - {name: x_addr,       dir: from_sink,   width: 12, description: "pixel read address (W_F bits)"}
      - {name: x_rdata,      dir: from_source, width: 8, description: "combinational pixel read data"}
  - id: IFI-004
    name: learner_wram
    from_block: BLK-004
    to_block: BLK-005
    clock: clk_core
    type: memory_port
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: false
    signals:
      - {name: a_addr,  dir: from_source, width: 16, description: "port A address"}
      - {name: a_wdata, dir: from_source, width: 16, description: "port A write data"}
      - {name: a_we,    dir: from_source, width: 1,  description: "port A write enable"}
      - {name: a_rdata, dir: from_sink,   width: 16, description: "port A combinational read data"}
  - id: IFI-005
    name: csr_wram
    from_block: BLK-002
    to_block: BLK-005
    clock: clk_core
    type: memory_port
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: false
    signals:
      - {name: b_addr,    dir: from_source, width: 16, description: "port B address (WADDR)"}
      - {name: b_wdata,   dir: from_source, width: 16, description: "port B write data (WDATA[15:0])"}
      - {name: b_we,      dir: from_source, width: 1,  description: "port B write enable"}
      - {name: b_rdata,   dir: from_sink,   width: 16, description: "port B combinational read data"}
      - {name: init_go,   dir: from_source, width: 1,  description: "bulk-init start (gated on !busy in BLK-002)"}
      - {name: init_val,  dir: from_source, width: 16, description: "bulk-init value (W_INIT_VAL)"}
      - {name: init_busy, dir: from_sink,   width: 1,  description: "bulk-init in progress"}
  - id: IFI-006
    name: stats_csr
    from_block: BLK-006
    to_block: BLK-002
    clock: clk_core
    type: status
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: false
    signals:
      - {name: sample_count,  dir: from_source, width: 32}
      - {name: correct_count, dir: from_source, width: 32}
      - {name: error_count,   dir: from_source, width: 32}
      - {name: err,           dir: from_source, width: 1,  description: "sticky malformed-sample flag"}
      - {name: pred,          dir: from_source, width: 8,  description: "last predicted class"}
      - {name: clr_stats_p,   dir: from_sink,   width: 1,  description: "clear counters + err"}
  - id: IFI-007
    name: stream_stats
    from_block: BLK-003
    to_block: BLK-006
    clock: clk_core
    type: valid_only
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: false
    signals:
      - {name: err_p, dir: from_source, width: 1, description: "malformed sample pulse"}
  - id: IFI-008
    name: learner_stream
    from_block: BLK-004
    to_block: BLK-003
    clock: clk_core
    type: valid_only
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: false
    signals:
      - {name: accept_en, dir: from_source, width: 1, description: "s_ready = accept_en = run_active && learner IDLE"}
  - id: IFI-009
    name: learner_csr
    from_block: BLK-004
    to_block: BLK-002
    clock: clk_core
    type: status
    semantics:
      valid_may_depend_on_ready: false
      data_stable_while_stalled: true
      backpressure: false
    signals:
      - {name: busy, dir: from_source, width: 1, description: "run_active"}
      - {name: done, dir: from_source, width: 1, description: "step/halt completed"}

blocks:
  - id: BLK-001
    module: learn_accel
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: FEATURES, default: 784, range: "1..4096"}
      - {name: HIDDEN,   default: 32,  range: "1..512"}
      - {name: CLASSES,  default: 10,  range: "1..256"}
  - id: BLK-002
    module: apb_regs
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters: []
  - id: BLK-003
    module: sample_stream
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: FEATURES, default: 784, range: "1..4096"}
  - id: BLK-004
    module: learner
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: FEATURES, default: 784, range: "1..4096"}
      - {name: HIDDEN,   default: 32,  range: "1..512"}
      - {name: CLASSES,  default: 10,  range: "1..256"}
  - id: BLK-005
    module: weight_ram
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters:
      - {name: W_TOT, default: 25450, range: "1..65535"}
  - id: BLK-006
    module: stats
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters: []
  - id: BLK-007
    module: div_seq
    clock_domain: CD_CORE
    reset: rst_n
    source: custom
    parameters: []

memories:
  - id: MEM-001
    name: weight_mem
    owner: BLK-005
    depth: 25450
    width: 16
    ports: "dual (A: datapath, B: CSR+init)"
    implementation: inferred_reg_array   # OI-001: SRAM-macro replacement boundary
  - id: MEM-002
    name: sample_ram
    owner: BLK-003
    depth: 784
    width: 8
    ports: "write: sample_stream; read: learner"
    implementation: inferred_reg_array
  - id: MEM-003
    name: act_h_ram
    owner: BLK-004
    depth: 32
    width: 16
    ports: single
    implementation: inferred_reg_array
  - id: MEM-004
    name: out_delta_ram
    owner: BLK-004
    depth: 10
    width: 16
    ports: single
    implementation: inferred_reg_array
  - id: MEM-005
    name: delta_h_ram
    owner: BLK-004
    depth: 32
    width: 16
    ports: single
    implementation: inferred_reg_array
