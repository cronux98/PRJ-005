schema_version: "1.0"
stage: fe-arch
generated_for: fe-rtl
project_name: "mnist_npu"
source_spec: {manifest: spec/spec_manifest.yaml, verified: true}
technology: {pdk: fpga_generic, node_nm: null, stdcell_lib: null, core_voltage_v: null}
technology_deviation: >
  FPGA target (Xilinx Artix-7 100T / Nexys A7), not Sky130 130nm ASIC — explicit, documented
  instruction from the project brief, carried forward unchanged from spec_manifest.yaml. See
  arch.md §2.1. fe-rtl must not substitute any Sky130-specific artifact.
constraints: {rtl_language: verilog-2005, dft: none, custom_analog: false}
artifacts:
  - {file: arch.md, present: true}
  - {file: block_diagram.mmd, present: true}
  - {file: fsm_diagrams.mmd, present: true}
  - {file: interface_defs.yaml, present: true}
  - {file: cdc_plan.md, present: true}
  - {file: power_plan.md, present: true}
  - {file: rtl_coding_guidelines.md, present: true}
  - {file: golden_model/golden_ref_model.c, present: true, source: frozen_preexisting}
  - {file: golden_model/weights.hex, present: true, source: frozen_preexisting}
  - {file: golden_model/images.hex, present: true, source: frozen_preexisting}
  - {file: golden_model/labels.hex, present: true, source: frozen_preexisting}
  - {file: golden_model/expected.hex, present: true, source: frozen_preexisting}
  - {file: golden_model/expected_outputs.txt, present: true, source: frozen_preexisting}
  - {file: golden_model/README.md, present: true, source: frozen_preexisting}

module_list:                       # fe-rtl must produce exactly these
  - {block: BLK-001, module: mnist_npu, source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-002, module: ctrl_fsm,       source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-003, module: mac_datapath,   source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-004, module: sigmoid_lut,    source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-005, module: weight_rom,     source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-006, module: image_rom,      source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-007, module: label_rom,      source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-008, module: hidden_ram,     source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-009, module: uart_tx,        source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-010, module: led_ctrl,       source: custom, clock: clk_core, reset: rst_n}
  - {block: BLK-011, module: uart_line_fmt,  source: custom, clock: clk_core, reset: rst_n}

clock_domains:
  - {id: CLK-001, name: clk_core, domain: CD_CORE, period_ns: 10.000, async_with: []}

cdc_paths: []   # single clock domain — zero crossings, see cdc_plan.md

fsms:
  - {id: FSM-001, module: ctrl_fsm,      states: 10, encoding: binary}
  - {id: FSM-002, module: uart_line_fmt, states: 3,  encoding: binary}
  - {id: FSM-003, module: uart_tx,       states: 4,  encoding: binary}

memories:
  - {id: MEM-001, module: weight_rom,  depth: 25450, width: 16, signed: true,  init_file: "arch/golden_model/weights.hex"}
  - {id: MEM-002, module: image_rom,   depth: 78400, width: 8,  signed: false, init_file: "arch/golden_model/images.hex"}
  - {id: MEM-003, module: label_rom,   depth: 100,   width: 8,  signed: false, init_file: "arch/golden_model/labels.hex"}
  - {id: MEM-004, module: hidden_ram,  depth: 32,    width: 16, signed: false, init_file: null}
  - {id: MEM-005, module: sigmoid_lut, depth: 65536, width: 8,  signed: false, init_file: "rtl/sigmoid_lut.hex"}   # generated by tools/gen_sigmoid_lut.py, fe-rtl stage

golden_model:
  granularity: transaction         # one forward() call = one image
  vector_count: 100                # first 100 images of the 10,000-image MNIST test set
  full_set_accuracy: "92.25% (9225 correct / 270 incorrect / 505 trash, reproduced this stage)"
  output_format: "expected.hex: 4 words/image (pred, confidence, expected_label, verdict), 0x-prefixless hex, one word/line"
  stimulus_hex: [arch/golden_model/images.hex, arch/golden_model/labels.hex]
  expected_hex: arch/golden_model/expected.hex
  build_command: "gcc -std=c99 -O2 -Wall -Wextra -o gm arch/golden_model/golden_ref_model.c"
  run_command: "./gm .   # from the mnist_npu project root"
  executed_by_skill: true   # exception to the usual fe-arch rule: re-running the EXISTING frozen
                             # model to confirm reproducibility is not "authoring/executing a new
                             # model" — see arch.md §11. Confirmed byte-identical to the committed
                             # files (git status clean after the run).
  source: frozen_preexisting

counts: {blocks: 11, fsms: 3, internal_interfaces: 9, memories: 5, cdc_paths: 0, ip_reused: 0, blackboxes: 0}

review_gate:
  all_must_requirements_mapped: true
  every_block_has_clock_and_reset: true
  every_fsm_has_full_transition_table: true
  every_cdc_has_mechanism_and_module: true    # vacuously true — 0 CDC paths exist
  no_dft_structures: true
  no_systemverilog_in_examples: true
  golden_model_deterministic: true

open_issues: []
