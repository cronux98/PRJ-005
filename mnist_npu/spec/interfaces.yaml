schema_version: "1.0"
stage: fe-spec

clocks:
  - id: CLK-001
    name: clk_core
    domain: CD_CORE
    frequency_mhz: 100.0
    period_ns: 10.000
    source: external_pad         # FPGA: board oscillator / clock-management tile; out of scope this stage
    duty_cycle_pct: 50
    jitter_ns: 0.100

resets:
  - id: RST-001
    name: rst_n
    polarity: active_low
    type: sync                   # DEVIATION from fe-spec default (async_assert_sync_deassert): brief mandates
                                  # fully synchronous reset, no async reset input to any flop (REQ-023)
    domain: CD_CORE
    source: external_pad
    min_assert_cycles: 2         # ASM-001
    sequencing: "Single clock domain; no cross-domain reset sequencing required."

interfaces:
  - id: IF-001
    name: uart_tx_if
    protocol: UART
    role: master                 # TX only, no handshake, no RX
    clock: clk_core
    reset: rst_n
    async_to_core: false
    timing_budget:
      input_delay_ns: null       # output-only interface, no inputs
      output_delay_ns: 3.000     # 30% of 10.000 ns period
    signals:
      - {name: uart_tx, dir: output, width: 1, active: high, description: "115200 8N1 serial TX, idles high (mark)"}

  - id: IF-002
    name: led_status_if
    protocol: custom              # simple GPIO/status output bus, no protocol framing
    role: master
    clock: clk_core
    reset: rst_n
    async_to_core: false
    timing_budget:
      input_delay_ns: null
      output_delay_ns: 3.000
    signals:
      - {name: "led[9:0]",  dir: output, width: 10, active: high, description: "One-hot predicted digit; all 0 when verdict==TRASH"}
      - {name: "led[10]",   dir: output, width: 1,  active: high, description: "1 = verdict != CORRECT (INCORRECT or TRASH)"}
      - {name: "led[11]",   dir: output, width: 1,  active: high, description: "Blinks during inference compute window, steady during hold window"}

  - id: IF-003
    name: sys_if
    protocol: custom
    role: slave
    clock: clk_core
    reset: rst_n
    async_to_core: false
    timing_budget: {input_delay_ns: 3.000, output_delay_ns: null}
    signals:
      - {name: clk,   dir: input, width: 1, active: high, description: "Core clock, 100 MHz nominal (CLK-001)"}
      - {name: rst_n, dir: input, width: 1, active: low,  description: "Synchronous active-low reset (RST-001)"}

  # Explicitly absent by requirement (REQ-015): no host bus, no CSR/APB/AXI, no bootrom/firmware
  # interface. All program data (weights/images/labels) enters via $readmemh memory
  # initialisation at elaboration time (REQ-012/013/014), not through any port.

cdc_requirements: []            # single clock domain (CD_CORE only) — no crossings exist

analog_macros: []                # FPGA target: no Sky130 (or any) analog macros instantiated; N/A
