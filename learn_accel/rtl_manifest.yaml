schema_version: "1.0"
stage: fe-rtl
project_name: rinriAI
source_arch: {manifest: arch/arch_manifest.yaml, verified: true}
technology: {pdk: sky130, node_nm: 130, stdcell_lib: sky130_fd_sc_hd}
language: verilog-2001            # mirrors arch_manifest constraints.rtl_language
dft: none
modules:
  - {block: BLK-001, module: learn_accel,  file: rtl/learn_accel.v,  source: custom, clock: clk_core, reset: rst_n,
     traces: [REQ-001, REQ-008, REQ-009, REQ-012, REQ-014, REQ-015, REQ-022], status: complete}
  - {block: BLK-002, module: apb_regs,     file: rtl/apb_regs.v,     source: custom, clock: clk_core, reset: rst_n,
     traces: [REQ-006, REQ-009, REQ-010, REQ-013, REQ-017, REQ-020], status: complete}
  - {block: BLK-003, module: sample_stream, file: rtl/sample_stream.v, source: custom, clock: clk_core, reset: rst_n,
     traces: [REQ-008, REQ-016, REQ-018], status: complete}
  - {block: BLK-004, module: learner,      file: rtl/learner.v,      source: custom, clock: clk_core, reset: rst_n,
     traces: [REQ-002, REQ-003, REQ-004, REQ-005, REQ-011, REQ-016, REQ-017, REQ-021], status: complete}
  - {block: BLK-005, module: weight_ram,   file: rtl/weight_ram.v,   source: custom, clock: clk_core, reset: rst_n,
     traces: [REQ-006, REQ-013, REQ-020, REQ-021, REQ-022], status: complete}
  - {block: BLK-006, module: stats,        file: rtl/stats.v,        source: custom, clock: clk_core, reset: rst_n,
     traces: [REQ-007, REQ-013, REQ-018, REQ-019], status: complete}
  - {block: BLK-007, module: div_seq,      file: rtl/div_seq.v,      source: custom, clock: clk_core, reset: rst_n,
     traces: [REQ-004, REQ-011], status: complete}
cdc_implementations: []           # zero CDC paths (single domain, cdc_plan.md)
sdc: {file: sdc/sdc_spec.json, consumer: fe-opensta, clocks: 1, generated_clocks: 0,
      false_paths: 0, multicycle_paths: 0, async_groups: 0}
filelist: {file: filelist.f, includes: [rtl], excludes: [rtl/blackbox]}
testbenches: [{file: tb/tb_learn_accel.v, executed: false}]
tools_executed: none
review_gate:
  all_modules_present: true       # BLK-001..007 all in rtl/, all custom
  no_systemverilog: true
  no_dft: true
  no_inferred_latches: true
  all_flops_reset_or_exempt: true # MEM-002 reset-exempt under write-before-read (documented)
  all_cdc_implemented: true       # vacuous: zero CDC paths
  sdc_complete: true
open_issues:
  - {id: OI-001, status: open, owner: architect,
     description: "Weight RAM: inferred reg array in RTL; SRAM macro replacement at integration adds 1-cycle CSR read latency (WDATA read -> 1 wait state, spec deviation, needs erratum)"}
  - {id: OI-002, status: open, owner: user,
     description: "Verify sky130_sram_* cell names against installed PDK before any macro stub/constraint"}
  - {id: OI-003, status: open, owner: user,
     description: "REQ-025 stretch target needs downstream firmware/experiment harness"}
  - {id: OI-004, status: open, owner: user,
     description: "REQ-025 recipe lr_shift=8 yields sub-LSB Q8.8 updates; usable range lr_shift 0-3 (golden vectors use 0); spec erratum suggested (reword to lr_shift=2)"}
  - {id: OI-005, status: rtl_resolved, owner: architect,
     description: "IFI-002 omits pred[7:0] level learner->stats, exposed by IFI-006; RTL resolves: learner drives pred = combinational best_idx (OI-005), stats samples it at sample_done_p. Arch erratum suggested (add signal to IFI-002). Not blocking — RTL authoritative."}
  - {id: OI-006, status: rtl_resolved, owner: architect,
     description: "arch.md 4.5 'two always blocks (port A, port B)' unimplementable as stated (multiply-driven); RTL uses one mem_wr block with both write paths + documented RDW mechanism + deterministic B-wins fallback. Erratum suggested."}
  - {id: OI-007, status: rtl_resolved, owner: architect,
     description: "rtl_coding_guidelines 8 says W_F = clog2(FEATURES+1) (=10 for 784) but interface_defs pins W_F=12; RTL uses explicit W_F=12 (over-provisioned 2 bits, harmless). Erratum: amend guideline formula."}
  - {id: OI-008, status: rtl_resolved, owner: architect,
     description: "arch.md 6.2/IFI-008 accept_en = run_active && IDLE leaves a 1-cycle window between label capture and learner accept where a back-to-back feeder can overwrite the pending sample; RTL fix: accept_en = run_active && IDLE && !sample_valid. Arch erratum suggested. Required for TB to pass."}
user_next_steps:
  - "iverilog -g2001 -Wall -o sim $(cat filelist.f) tb/tb_learn_accel.v && vvp sim   # TB reads arch/golden_model/{stimulus,expected}.hex"
  - "verilator --lint-only -Wall $(cat filelist.f)"
  - "gcc -std=c99 -O2 -Wall -Wextra -o gm arch/golden_model/golden_ref_model.c && ./gm > got.txt && diff -u arch/golden_model/expected_outputs.txt got.txt"
  - "python3 <fe-opensta>/scripts/gen_sdc.py sdc/sdc_spec.json sdc/rinriAI.sdc && bash <fe-opensta>/scripts/qa_sdc.sh learn_accel <netlist> sdc/rinriAI.sdc"
  - "fe-yosys with filelist.f (rtl/*.v only; rtl/blackbox/ excluded), then fe-opensta for STA"
